[package]
name = "swal-tools-web"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Web tools: git→isomorphic-git, fs→OPFS, shell→WebContainers (wasm32)"

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dependencies.web-sys]
version = "0.3"
features = [
  "File",
  "Blob",
  "Window",
  "Worker",
]
