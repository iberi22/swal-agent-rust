[package]
name = "swal-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "TUI/CLI entry: wires gestalt state, skills cache, starts loop/gateway/sched"

[dependencies]
swal-core = { path = "../swal-core" }
swal-loop = { path = "../swal-loop" }
swal-store = { path = "../swal-store" }
gestalt_core = { workspace = true }
synapse-agentic = { workspace = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
dirs = "5.0"
